[project]
name = "transformer-notes"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
transformer-notes = "transformer_notes:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# OneDrive blocks removing hard-linked files in .venv, so copy instead of linking.
link-mode = "copy"
